openapi: 3.1.0
info:
  title: Pantry Panel API
  version: 0.1.0
  description: 家庭の食品・日用品の在庫管理 API

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Backend and DB are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/stock-items:
    get:
      summary: List all stock items
      operationId: listStockItems
      responses:
        "200":
          description: List of stock items ordered by updatedAt descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockItem"

    post:
      summary: Create a stock item
      operationId: createStockItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockItemRequest"
      responses:
        "201":
          description: Stock item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockItem"
        "400":
          description: Validation error (missing name or category)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/image-search:
    get:
      summary: Search images via Google Custom Search
      operationId: searchImages
      description: |
        Proxies to Google Custom Search JSON API (search type=image).
        Backend が API key を保持し、frontend には露出させない。
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Search query (商品名等)
        - name: num
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
          description: Maximum number of results
      responses:
        "200":
          description: Image search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSearchResponse"
        "400":
          description: Query parameter q is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Google API quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream Google API failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Image search not configured (GOOGLE_CSE_API_KEY / GOOGLE_CSE_ID unset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/stock-items/{id}:
    patch:
      summary: Update a stock item
      operationId: updateStockItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStockItemRequest"
      responses:
        "200":
          description: Stock item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockItem"
        "404":
          description: Stock item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a stock item
      operationId: deleteStockItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Stock item deleted
        "404":
          description: Stock item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Cannot delete (wantToBuy is true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    StockItem:
      type: object
      required:
        - id
        - name
        - category
        - wantToBuy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        imageUrl:
          type: string
          nullable: true
        wantToBuy:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateStockItemRequest:
      type: object
      required:
        - name
        - category
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1

    UpdateStockItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        wantToBuy:
          type: boolean
        imageUrl:
          type: string
          nullable: true
          description: |
            - フィールド省略時: image_url を変更しない (partial update)
            - 文字列を送信: image_url を当該値に更新
            - null を明示送信: image_url を NULL に更新 (画像解除)

    ImageSearchResult:
      type: object
      required:
        - imageUrl
        - thumbnailUrl
        - title
      properties:
        imageUrl:
          type: string
          description: フルサイズ画像 URL (Google CSE の `link`)
        thumbnailUrl:
          type: string
          description: サムネイル画像 URL (Google CSE の `image.thumbnailLink`)
        title:
          type: string

    ImageSearchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImageSearchResult"

    HealthResponse:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: string
          enum:
            - ok
            - error
        db:
          type: string
          enum:
            - connected
            - disconnected

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
