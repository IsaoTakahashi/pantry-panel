name: E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: frontend

      - name: Start backend
        run: go run . &
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.E2E_SUPABASE_DATABASE_URL }}
          SUPABASE_JWKS_URL: "${{ secrets.E2E_SUPABASE_URL }}/auth/v1/.well-known/jwks.json"
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          PORT: "8080"

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          exit 1

      - name: Run E2E tests (mock)
        run: npx playwright test --project=mock
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_GROUP_ID: ${{ secrets.E2E_TEST_GROUP_ID }}

      - name: Write test summary
        if: always()
        working-directory: frontend
        run: |
          [ -f results.xml ] || exit 0
          tests=$(grep -om1 'tests="[0-9]*"' results.xml | grep -o '[0-9]*')
          failures=$(grep -om1 'failures="[0-9]*"' results.xml | grep -o '[0-9]*')
          errors=$(grep -om1 'errors="[0-9]*"' results.xml | grep -o '[0-9]*')
          skipped=$(grep -om1 'skipped="[0-9]*"' results.xml | grep -o '[0-9]*')
          tests=${tests:-0}; failures=${failures:-0}; errors=${errors:-0}; skipped=${skipped:-0}
          failed=$((failures + errors))
          passed=$((tests - failed - skipped))
          if [ "$failed" -gt 0 ]; then icon="❌"; else icon="✅"; fi
          {
            echo "## ${icon} E2E Tests (mock)"
            echo ""
            echo "| | Count |"
            echo "|---|---|"
            echo "| ✅ Passed | ${passed} |"
            echo "| ❌ Failed | ${failed} |"
            echo "| ⏭️ Skipped | ${skipped} |"
            echo "| **Total** | **${tests}** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mock
          path: frontend/playwright-report
