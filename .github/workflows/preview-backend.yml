name: Preview Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/preview-backend.yml"
      - ".github/workflows/_deploy-backend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: preview-backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-backend.yml
    with:
      image-tag-suffix: pr-${{ github.event.pull_request.number }}
      lambda-function-name: ${{ vars.PREVIEW_LAMBDA_FUNCTION_NAME }}
      lambda-function-url: ${{ vars.PREVIEW_LAMBDA_FUNCTION_URL }}
      git-ref: ${{ github.event.pull_request.head.sha }}
