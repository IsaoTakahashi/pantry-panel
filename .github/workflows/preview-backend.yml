name: Preview Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/preview-backend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: preview-backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image URI
        id: image
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ vars.ECR_REPOSITORY }}"
          SHA="${{ github.sha }}"
          echo "uri=${REGISTRY}/${REPO}:${SHA}" >> $GITHUB_OUTPUT
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT

      - name: Build and push (linux/amd64, no provenance for Lambda)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          provenance: false
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.image.outputs.registry }}/${{ steps.image.outputs.repo }}:pr-preview

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.PREVIEW_LAMBDA_FUNCTION_NAME }}" \
            --image-uri "${{ needs.build-and-push.outputs.image-uri }}" \
            --publish \
            --output json

      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "${{ vars.PREVIEW_LAMBDA_FUNCTION_NAME }}"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Curl /health (retry up to 5 minutes)
        run: |
          curl -fsS \
            --retry 30 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ vars.PREVIEW_LAMBDA_FUNCTION_URL }}/health"
