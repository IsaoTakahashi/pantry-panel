name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/_deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-backend.yml
    with:
      image-tag-suffix: latest
      lambda-function-name: ${{ vars.LAMBDA_FUNCTION_NAME }}
      lambda-function-url: ${{ vars.LAMBDA_FUNCTION_URL }}
