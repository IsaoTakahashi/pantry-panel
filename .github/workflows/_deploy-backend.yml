name: _Deploy Backend (reusable)

on:
  workflow_call:
    inputs:
      image-tag-suffix:
        description: "Extra image tag pushed alongside the SHA tag (e.g. latest, pr-123)"
        required: true
        type: string
      lambda-function-name:
        description: "Target Lambda function name to update"
        required: true
        type: string
      lambda-function-url:
        description: "Public Function URL for smoke test (without trailing slash)"
        required: true
        type: string
      git-ref:
        description: "Optional explicit git ref to checkout (e.g. PR head SHA). Empty = default ref."
        required: false
        type: string
        default: ""

# NOTE: reusable workflow の permissions は caller の GITHUB_TOKEN 権限を狭めるだけで、
# `id-token: write` を含む caller 側 permissions は **必ず caller 側にも明示する必要がある** (継承ではない)。
# deploy-backend.yml / preview-backend.yml の top-level permissions を参照。
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git-ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image URI
        id: image
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ vars.ECR_REPOSITORY }}"
          SHA="${{ github.sha }}"
          echo "uri=${REGISTRY}/${REPO}:${SHA}" >> $GITHUB_OUTPUT
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT

      - name: Build and push (linux/amd64, no provenance for Lambda)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          provenance: false
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.image.outputs.registry }}/${{ steps.image.outputs.repo }}:${{ inputs.image-tag-suffix }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ inputs.lambda-function-name }}" \
            --image-uri "${{ needs.build-and-push.outputs.image-uri }}" \
            --publish \
            --output json

      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "${{ inputs.lambda-function-name }}"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Curl /health (retry up to 5 minutes)
        run: |
          curl -fsS \
            --retry 30 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ inputs.lambda-function-url }}/health"
