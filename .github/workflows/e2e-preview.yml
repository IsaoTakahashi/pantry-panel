name: E2E Preview

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  deployments: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.vercel.outputs.preview_url }}
    steps:
      - name: Wait for Vercel preview deployment
        id: vercel
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "Waiting for Vercel preview deployment for SHA: $SHA"
          PREVIEW_URL=""
          for i in $(seq 1 40); do
            DEPLOYS=$(gh api "repos/${{ github.repository }}/deployments" 2>/dev/null) || DEPLOYS="[]"
            DEPLOY_ID=$(echo "$DEPLOYS" | jq -r \
              --arg sha "$SHA" \
              '[.[] | select(.sha==$sha and (.environment | ascii_downcase | contains("preview")))] | .[0].id // ""')

            if [ -n "$DEPLOY_ID" ] && [ "$DEPLOY_ID" != "null" ]; then
              STATUSES=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" 2>/dev/null) || STATUSES="[]"
              PREVIEW_URL=$(echo "$STATUSES" | jq -r \
                '[.[] | select(.state=="success")] | .[0].environment_url // ""')

              if [ -n "$PREVIEW_URL" ] && [ "$PREVIEW_URL" != "null" ]; then
                echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
                echo "Vercel preview ready: $PREVIEW_URL"
                break
              fi
            fi

            echo "Attempt $i/40: not ready yet, waiting 15s..."
            sleep 15
          done
          if [ -z "$PREVIEW_URL" ]; then
            echo "Timed out waiting for Vercel preview (10 min)" && exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Wait for preview-backend if running
        run: |
          sleep 15
          ACTIVE=$(gh run list \
            --workflow=preview-backend.yml \
            --commit "${{ github.sha }}" \
            --json databaseId,status \
            --jq '.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting") | .databaseId' \
            | head -1)
          if [ -n "$ACTIVE" ]; then
            echo "Waiting for preview-backend run $ACTIVE..."
            gh run watch "$ACTIVE" --exit-status
          else
            FAILED=$(gh run list \
              --workflow=preview-backend.yml \
              --commit "${{ github.sha }}" \
              --json conclusion \
              --jq '.[] | select(.conclusion=="failure" or .conclusion=="cancelled") | .conclusion' \
              | head -1)
            if [ -n "$FAILED" ]; then
              echo "preview-backend workflow $FAILED" && exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check backend health
        run: |
          curl -fsS \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ vars.PREVIEW_LAMBDA_FUNCTION_URL }}/health"

  e2e-preview:
    needs: prepare
    runs-on: ubuntu-latest
    # Playwright official image: bundles Chromium/Firefox/WebKit + system deps.
    # Eliminates `npx playwright install` (no CDN dependency, no cache miss).
    # Image tag must match @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@v7

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run E2E tests (preview)
        run: npx playwright test --project=preview
        working-directory: frontend
        env:
          PREVIEW_URL: ${{ needs.prepare.outputs.preview_url }}
          PREVIEW_BACKEND_URL: ${{ vars.PREVIEW_LAMBDA_FUNCTION_URL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          # E2E_TEST_GROUP_ID は渡さず global-setup で run ごとに新規 group を作る。
          # 並走 PR 同士のテストデータ衝突を避けるため。
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}

      - name: Write test summary
        if: always()
        working-directory: frontend
        run: |
          [ -f results.xml ] || exit 0
          tests=$(grep -om1 'tests="[0-9]*"' results.xml | grep -o '[0-9]*')
          failures=$(grep -om1 'failures="[0-9]*"' results.xml | grep -o '[0-9]*')
          errors=$(grep -om1 'errors="[0-9]*"' results.xml | grep -o '[0-9]*')
          skipped=$(grep -om1 'skipped="[0-9]*"' results.xml | grep -o '[0-9]*')
          tests=${tests:-0}; failures=${failures:-0}; errors=${errors:-0}; skipped=${skipped:-0}
          failed=$((failures + errors))
          passed=$((tests - failed - skipped))
          if [ "$failed" -gt 0 ]; then icon="❌"; else icon="✅"; fi
          {
            echo "## ${icon} E2E Tests (preview)"
            echo ""
            echo "| | Count |"
            echo "|---|---|"
            echo "| ✅ Passed | ${passed} |"
            echo "| ❌ Failed | ${failed} |"
            echo "| ⏭️ Skipped | ${skipped} |"
            echo "| **Total** | **${tests}** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-preview
          path: frontend/playwright-report
